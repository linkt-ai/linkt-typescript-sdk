name: Publish NPM
on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  publication-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject SDK publication
        run: |
          echo "SDK publication is disabled. Use direct HTTP or MCP for new integrations."
          exit 1
