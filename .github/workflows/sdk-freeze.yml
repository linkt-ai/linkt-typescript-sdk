name: SDK freeze
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify publication rejection and migration notices
        run: python3 .github/scripts/test-sdk-freeze.py
